# Xcode project for Clutch. Generate it with:  xcodegen
# Before building on your iPhone, change BASE_BUNDLE_ID to something unique
# (for example com.yourname.clutch) and pick your Team in Xcode.
name: Clutch
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    BASE_BUNDLE_ID: com.example.clutch
    APP_GROUP_ID: group.$(BASE_BUNDLE_ID)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Clutch:
    type: application
    platform: iOS
    sources:
      - Clutch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Clutch/Info.plist
      properties:
        CFBundleDisplayName: Clutch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: Clutch saves clips to Photos when you ask it to.
        NSMicrophoneUsageDescription: Clutch can record your voice along with your game when you turn the microphone on.
    entitlements:
      path: Clutch/Clutch.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - target: ClutchBroadcast
        embed: true
      - sdk: ReplayKit.framework
      - sdk: AVKit.framework
  ClutchBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - ClutchBroadcast
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).broadcast
    info:
      path: ClutchBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Clutch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: ClutchBroadcast/ClutchBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - sdk: ReplayKit.framework
schemes:
  Clutch:
    build:
      targets:
        Clutch: all
