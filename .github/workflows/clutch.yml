# Builds the Clutch game-clip apps whenever their code changes.
# Download the results from the run's "Artifacts" section on GitHub.
name: Build Clutch apps

on:
  push:
    paths:
      - "clips/**"
      - ".github/workflows/clutch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: clips/android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Clutch-android
          path: clips/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  ios:
    name: iPhone app (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: clips/ios
        run: |
          brew install xcodegen
          xcodegen
      - name: Build
        working-directory: clips/ios
        run: |
          xcodebuild -project Clutch.xcodeproj -scheme Clutch -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        working-directory: clips/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Clutch.app Payload/
          zip -qry Clutch-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Clutch-iphone-unsigned
          path: clips/ios/Clutch-unsigned.ipa
          if-no-files-found: error
